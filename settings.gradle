pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google { content { includeGroupByRegex 'androidx(\\..*)?'; includeGroupByRegex 'com\\.android(\\..*)?'; includeGroupByRegex 'com\\.google\\.android(\\..*)?'; includeGroupByRegex 'com\\.google\\.testing(\\..*)?' } }
        mavenCentral()
    }
}
rootProject.name = 'Margy Max'
include ':app'
